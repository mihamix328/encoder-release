name: Windows clients

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        id: deps
        with:
          environment-name: encoder-build
          create-args: >-
            -c conda-forge qt6-main=6.12 openssl=3.6 cmake ninja
          init-shell: none
          cache-downloads: true
      - name: Build and test both clients
        shell: pwsh
        env:
          DEPENDENCY_PREFIX: ${{ steps.deps.outputs.environment-path }}
        run: |
          $env:PATH = "$env:DEPENDENCY_PREFIX\Library\bin;$env:PATH"
          $plugin = @(Get-ChildItem "$env:DEPENDENCY_PREFIX/Library" -Recurse -Filter qminimal.dll)[0]
          if (!$plugin) { throw 'Qt test platform plugin not found' }
          $env:QT_PLUGIN_PATH = Split-Path $plugin.DirectoryName -Parent
          cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:DEPENDENCY_PREFIX/Library" -DBUILD_SERVER=OFF -DBUILD_CLIENT=ON -DBUILD_ADMIN=ON -DBUILD_GUI=ON -DBUILD_UI_TESTS=ON
          if ($LASTEXITCODE) { throw 'Configuration failed' }
          cmake --build build/windows --config Release --parallel 2
          if ($LASTEXITCODE) { throw 'Build failed' }
          ctest --test-dir build/windows -C Release --output-on-failure --timeout 45
          if ($LASTEXITCODE) { throw 'Tests failed' }
          ./cmake/PackageWindowsConda.ps1 -DependencyPrefix $env:DEPENDENCY_PREFIX -BuildDirectory build/windows -OutputDirectory build/windows-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-clients-x64
          path: build/windows-release/*.zip
          if-no-files-found: error
